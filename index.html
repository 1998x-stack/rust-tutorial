<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>课程目录</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(145deg, #f9fcf5 0%, #e8f3e8 100%);
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', system-ui, -apple-system, sans-serif;
            padding: 2rem 1.5rem 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            display: block;
            max-width: 1400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(2px);
            border-radius: 48px 48px 32px 32px;
            padding: 2rem 2rem 1.5rem;
            box-shadow: 0 20px 40px rgba(90, 140, 100, 0.15), 0 8px 20px rgba(0, 30, 20, 0.08);
            border: 1px solid rgba(255, 245, 200, 0.5);
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 2rem;
            border-bottom: 4px solid #f7d44a;
            padding-bottom: 0.75rem;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #2b7a4b, #3f9e6b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 8px rgba(60, 140, 80, 0.12);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header h1 .emoji {
            font-size: 2.2rem;
            filter: drop-shadow(0 2px 4px rgba(255, 200, 50, 0.3));
        }

        .header .sub {
            font-size: 1rem;
            background: #fef7e0;
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            color: #3f6b4a;
            font-weight: 600;
            border: 1px solid #f3d98a;
            box-shadow: 0 2px 6px rgba(200, 160, 50, 0.1);
            white-space: nowrap;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.2rem;
            margin: 1.8rem 0 1.2rem;
        }

        .card {
            background: #ffffff;
            border-radius: 28px;
            padding: 1rem 1.2rem 1rem 1.2rem;
            box-shadow: 0 6px 14px rgba(70, 120, 80, 0.08), 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
            border: 1px solid rgba(210, 230, 200, 0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            backdrop-filter: blur(2px);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 24px rgba(70, 140, 90, 0.15), 0 4px 12px rgba(40, 100, 60, 0.05);
            border-color: #b8d9b0;
            background: #fefefc;
        }

        .card-header {
            display: flex;
            align-items: baseline;
            gap: 0.4rem;
            margin-bottom: 0.4rem;
            flex-wrap: wrap;
        }

        .chapter-num {
            font-size: 1.1rem;
            font-weight: 700;
            background: #f5d142;
            color: #2a5a3a;
            padding: 0 0.6rem;
            border-radius: 40px;
            line-height: 1.6;
            display: inline-block;
            box-shadow: inset 0 -2px 0 #dbb42c;
            letter-spacing: 0.3px;
            min-width: 2.2rem;
            text-align: center;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 650;
            color: #1f4d33;
            letter-spacing: -0.3px;
            line-height: 1.3;
            flex: 1;
        }

        .topic-list {
            list-style: none;
            margin-top: 0.3rem;
            padding-left: 0.2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.2rem 0.6rem;
        }

        .topic-list li {
            font-size: 0.8rem;
            color: #2d543a;
            background: #f1f9ee;
            padding: 0.1rem 0.7rem 0.2rem 1.2rem;
            border-radius: 30px;
            line-height: 1.6;
            position: relative;
            border: 1px solid #dcebd4;
            box-shadow: inset 0 1px 2px white;
        }

        .topic-list li::before {
            content: "⚡";
            position: absolute;
            left: 4px;
            top: 0px;
            font-size: 0.7rem;
            color: #e5b13b;
        }

        .card-footer {
            margin-top: 0.6rem;
            display: flex;
            justify-content: flex-end;
            border-top: 1px dashed #d4e8d0;
            padding-top: 0.5rem;
        }

        .card-footer a {
            background: #b7d8b0;
            color: #1f452b;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 0.2rem 1.2rem;
            border-radius: 40px;
            transition: 0.15s;
            border: 1px solid #8fb88a;
            box-shadow: 0 2px 4px rgba(60, 120, 60, 0.1);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .card-footer a::after {
            content: "→";
            font-size: 1rem;
            transition: transform 0.1s;
        }

        .card-footer a:hover {
            background: #f7d44a;
            border-color: #dbb42c;
            color: #1f3d28;
            box-shadow: 0 4px 8px rgba(200, 160, 40, 0.2);
            transform: scale(1.02);
        }

        .card-footer a:active {
            transform: scale(0.96);
        }

        .footer {
            margin-top: 2.5rem;
            text-align: center;
            font-size: 1rem;
            color: #3b6b47;
            background: #f2fcee;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            display: inline-block;
            border: 1px solid #c6dfbe;
            box-shadow: 0 2px 8px rgba(80, 130, 70, 0.08);
            font-weight: 500;
            letter-spacing: 0.3px;
            backdrop-filter: blur(2px);
        }

        .footer span {
            background: #f9eec1;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            margin: 0 4px;
        }

        @media (max-width: 640px) {
            body { padding: 1rem 0.8rem; }
            .container { padding: 1.2rem 1rem; border-radius: 32px; }
            .header h1 { font-size: 1.8rem; }
            .header .sub { font-size: 0.75rem; padding: 0.2rem 0.8rem; }
            .course-grid { grid-template-columns: 1fr; gap: 1rem; }
            .card-title { font-size: 1.05rem; }
            .topic-list li { font-size: 0.7rem; }
        }

        @media (min-width: 768px) and (max-width: 1024px) {
            .course-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .container::before {
            content: "";
            display: block;
            height: 6px;
            width: 120px;
            background: linear-gradient(90deg, #f7d44a, #7fc47c, #4aa0b0, #f7b07a);
            border-radius: 10px;
            margin-bottom: 0.2rem;
        }

        .card:nth-child(6n+1) .chapter-num { background: #f7b07a; color: #3d2e1a; }
        .card:nth-child(6n+2) .chapter-num { background: #a7d4a0; color: #1f452b; }
        .card:nth-child(6n+3) .chapter-num { background: #f5d44a; color: #2f4d2a; }
        .card:nth-child(6n+4) .chapter-num { background: #b3d9e8; color: #1a3f4a; }
        .card:nth-child(6n+5) .chapter-num { background: #f7c6c6; color: #5a2e2e; }
        .card:nth-child(6n) .chapter-num { background: #c4b3e0; color: #2f2a4a; }

        .state-msg {
            text-align: center;
            padding: 3rem;
            color: #5f7f66;
            font-size: 1.1rem;
        }
        .state-msg.error {
            color: #b91c1c;
            background: #fef2f2;
            border-radius: 20px;
            margin: 1rem 0;
        }

        .toc { display: flex; flex-wrap: wrap; gap: 0.6rem; margin: 0 0 1rem; }
        .toc a { text-decoration: none; color: #1f4d33; background: #eef7ea; border: 1px solid #cfe6c6; padding: 0.25rem 0.9rem; border-radius: 30px; font-size: 0.9rem; font-weight: 600; }
        .toc a:focus-visible { outline: 3px solid #ea580c; outline-offset: 2px; }
        .filters { margin: 0.6rem 0 1rem; display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
        .filters label { font-weight: 600; color: #7c2d12; }
        .filters input[type="search"] { flex: 1 1 220px; min-width: 0; padding: 0.5rem 0.9rem; border: 2px solid #fed7aa; border-radius: 30px; font-size: 0.95rem; color: #1e293b; background: #fffbf5; }
        .filters input[type="search"]:focus-visible { outline: 3px solid #ea580c; outline-offset: 2px; }
        .stage-filter { padding: 0.4rem 1rem; border-radius: 30px; border: 2px solid #fed7aa; background: #fff7ed; color: #9a3412; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
        .stage-filter[aria-pressed="true"] { background: #ea580c; color: #fff; border-color: #c2410c; }
        .stage-filter:focus-visible { outline: 3px solid #ea580c; outline-offset: 2px; }
        .filter-empty { color: #9a3412; background: #fef9c3; border: 1px solid #facc15; border-radius: 16px; padding: 0.8rem 1rem; margin: 0 0 1rem; }
        .content-section { margin-top: 1.4rem; }
        .content-section h2 { color: #7c2d12; border-left: 6px solid #f97316; padding-left: 14px; font-size: 1.45rem; margin: 1.2rem 0 0.8rem; }
        figure { margin: 1.2rem 0; background: #fbfdf9; border: 1px solid #dfeed6; border-radius: 20px; padding: 1rem; }
        figure svg { display: block; width: 100%; height: auto; }
        figcaption { margin-top: 0.6rem; font-size: 0.88rem; color: #4b6b53; line-height: 1.6; }
    </style>
</head>
<body>
<main class="container">
    <div class="header">
        <h1><span class="emoji"></span><span class="title-text"></span></h1>
        <div class="sub"></div>
    </div>

    <nav class="toc" aria-label="页面导航">
        <a href="#path">学习路径</a>
        <a href="#chapters">章节目录</a>
    </nav>

    <section id="path" class="content-section">
        <h2>五阶段学习路径</h2>
        <p>课程共 28 章，按知识依赖关系分为五个递进阶段：先建立语法与所有权直觉，再学习抽象工具，最后进入并发与工程实战。每一章既可独立阅读，也建议按顺序推进。</p>
        <figure>
            <svg viewBox="0 0 900 190" role="img" aria-labelledby="pathTitle pathDesc">
                <title id="pathTitle">Rust 五阶段学习路径</title>
                <desc id="pathDesc">从基础语法到实战生态的五个阶段，覆盖第 1 至 28 章。</desc>
                <defs>
                    <marker id="pathArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                        <path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/>
                    </marker>
                </defs>
                <g font-family="system-ui, 'PingFang SC', sans-serif">
                    <rect x="12" y="35" width="152" height="92" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
                    <text x="88" y="72" text-anchor="middle" font-size="16" font-weight="700" fill="#7c2d12">基础语法</text>
                    <text x="88" y="98" text-anchor="middle" font-size="13" fill="#9a3412">第 01–05 章</text>

                    <rect x="192" y="35" width="152" height="92" rx="14" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
                    <text x="268" y="72" text-anchor="middle" font-size="16" font-weight="700" fill="#075985">抽象与所有权</text>
                    <text x="268" y="98" text-anchor="middle" font-size="13" fill="#0c4a6e">第 06–13 章</text>

                    <rect x="372" y="35" width="152" height="92" rx="14" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
                    <text x="448" y="72" text-anchor="middle" font-size="16" font-weight="700" fill="#713f12">函数式与工程</text>
                    <text x="448" y="98" text-anchor="middle" font-size="13" fill="#854d0e">第 14–18 章</text>

                    <rect x="552" y="35" width="152" height="92" rx="14" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
                    <text x="628" y="72" text-anchor="middle" font-size="16" font-weight="700" fill="#831843">内存与并发</text>
                    <text x="628" y="98" text-anchor="middle" font-size="13" fill="#9d174d">第 19–22 章</text>

                    <rect x="732" y="35" width="156" height="92" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
                    <text x="810" y="72" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">实战与生态</text>
                    <text x="810" y="98" text-anchor="middle" font-size="13" fill="#166534">第 23–28 章</text>

                    <path d="M167 81 H190" stroke="#ea580c" stroke-width="2" marker-end="url(#pathArrow)"/>
                    <path d="M347 81 H370" stroke="#ea580c" stroke-width="2" marker-end="url(#pathArrow)"/>
                    <path d="M527 81 H550" stroke="#ea580c" stroke-width="2" marker-end="url(#pathArrow)"/>
                    <path d="M707 81 H730" stroke="#ea580c" stroke-width="2" marker-end="url(#pathArrow)"/>
                </g>
            </svg>
            <figcaption>图 1：五阶段学习路径（教学示意）。箭头表示推荐的先后依赖关系，每阶段列出对应章号区间。</figcaption>
        </figure>
    </section>

    <section id="chapters" class="content-section">
        <h2>章节目录</h2>
        <div class="filters" role="group" aria-label="章节筛选">
            <label for="chapterSearch">搜索章节</label>
            <input type="search" id="chapterSearch" placeholder="输入标题或关键词，如“所有权”“并发”" autocomplete="off">
            <button type="button" class="stage-filter" data-range="1-28" aria-pressed="true">全部</button>
            <button type="button" class="stage-filter" data-range="1-5" aria-pressed="false">基础语法</button>
            <button type="button" class="stage-filter" data-range="6-13" aria-pressed="false">抽象与所有权</button>
            <button type="button" class="stage-filter" data-range="14-18" aria-pressed="false">函数式与工程</button>
            <button type="button" class="stage-filter" data-range="19-22" aria-pressed="false">内存与并发</button>
            <button type="button" class="stage-filter" data-range="23-28" aria-pressed="false">实战与生态</button>
        </div>
        <p id="filterStatus" class="filter-empty" role="status" aria-live="polite" hidden></p>
        <div id="cardContainer" class="course-grid"></div>
    </section>

    <div style="text-align:center;">
        <div class="footer"></div>
    </div>
</main>

<script>
    (function() {
        var container = document.getElementById('cardContainer');
        var emojiEl = document.querySelector('.header .emoji');
        var titleEl = document.querySelector('.header .title-text');
        var subEl = document.querySelector('.header .sub');
        var footerEl = document.querySelector('.footer');

        function showError(msg) {
            container.innerHTML = '<div class="state-msg error">' + msg + '</div>';
        }

        fetch('courses.json')
            .then(function(res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            })
            .then(function(data) {
                document.title = data.title + ' · 课程目录';
                emojiEl.textContent = data.emoji;
                titleEl.textContent = data.title;
                subEl.textContent = data.subtitle;
                footerEl.innerHTML = '<span>' + data.chapterCount + '章</span> 实战体系 · 从入门到精通';

                if (!data.chapters || data.chapters.length === 0) {
                    showError('暂无课程数据');
                    return;
                }

                container.innerHTML = '';
                data.chapters.forEach(function(course) {
                    var card = document.createElement('div');
                    card.className = 'card';

                    var headerDiv = document.createElement('div');
                    headerDiv.className = 'card-header';

                    var numSpan = document.createElement('span');
                    numSpan.className = 'chapter-num';
                    numSpan.textContent = course.num;

                    var titleSpan = document.createElement('span');
                    titleSpan.className = 'card-title';
                    titleSpan.textContent = course.title;

                    headerDiv.appendChild(numSpan);
                    headerDiv.appendChild(titleSpan);
                    card.appendChild(headerDiv);

                    if (course.topics && course.topics.length > 0) {
                        var topicUl = document.createElement('ul');
                        topicUl.className = 'topic-list';
                        course.topics.forEach(function(topic) {
                            var li = document.createElement('li');
                            li.textContent = topic;
                            topicUl.appendChild(li);
                        });
                        card.appendChild(topicUl);
                    }

                    var footerDiv = document.createElement('div');
                    footerDiv.className = 'card-footer';
                    var link = document.createElement('a');
                    link.href = course.file;
                    link.textContent = '开始学习 ';
                    footerDiv.appendChild(link);
                    card.appendChild(footerDiv);
                    card.dataset.num = course.num;
                    card.dataset.key = (course.title + ' ' + (course.topics || []).join(' ')).toLowerCase();

                    container.appendChild(card);
                });

            })
            .catch(function(err) {
                showError('课程数据加载失败: ' + err.message + '。请刷新页面重试。');
            });

        var searchEl = document.getElementById('chapterSearch');
        var stageBtns = Array.prototype.slice.call(document.querySelectorAll('.stage-filter'));
        var statusEl = document.getElementById('filterStatus');

        function applyFilter() {
            var cards = Array.prototype.slice.call(container.querySelectorAll('.card'));
            var q = (searchEl.value || '').trim().toLowerCase();
            var active = stageBtns.filter(function(b) { return b.getAttribute('aria-pressed') === 'true'; })[0];
            var range = active ? active.dataset.range.split('-').map(Number) : null;
            var visible = 0;
            cards.forEach(function(card) {
                var n = parseInt(card.dataset.num, 10);
                var show = (!q || card.dataset.key.indexOf(q) !== -1)
                    && (!range || (n >= range[0] && n <= range[1]));
                card.hidden = !show;
                if (show) visible++;
            });
            statusEl.hidden = visible !== 0;
            statusEl.textContent = visible === 0 ? '没有匹配的章节，请尝试其它关键词。' : '';
        }

        searchEl.addEventListener('input', applyFilter);
        stageBtns.forEach(function(btn) {
            btn.addEventListener('click', function() {
                stageBtns.forEach(function(b) { b.setAttribute('aria-pressed', 'false'); });
                btn.setAttribute('aria-pressed', 'true');
                applyFilter();
            });
        });
    })();
</script>

<noscript>
    <div style="background:#fcf0d9; padding:1rem; border-radius:20px; text-align:center; color:#92400e;">
        请启用 JavaScript 以浏览课程目录。
    </div>
</noscript>
</body>
</html>
